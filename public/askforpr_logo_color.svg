<svg width="600" height="600" viewBox="0 0 600 600" xmlns="http://www.w3.org/2000/svg">
<title>AskForPR</title>
<rect width="600" height="600" fill="#FAFAF8"/>

<!-- monogram icon -->
<g transform="translate(180,80)">
<text x="70" y="330" font-family="Liberation Serif, Georgia, serif" font-size="300" font-weight="700" fill="#C9942F">R</text>
<text x="0" y="330" font-family="Liberation Serif, Georgia, serif" font-size="300" font-weight="700" fill="#0B1F3A">P</text>
<circle cx="88" cy="185" r="9" fill="#C9942F"/>
<circle cx="118" cy="185" r="9" fill="#C9942F"/>
<circle cx="148" cy="185" r="9" fill="#C9942F"/>
</g>

<!-- wordmark -->
<text x="300" y="470" text-anchor="middle" font-family="Liberation Serif, Georgia, serif" font-size="72" font-weight="700">
<tspan fill="#0B1F3A">AskFor</tspan><tspan fill="#C9942F">PR</tspan>
</text>

<!-- tagline -->
<line x1="90" y1="505" x2="150" y2="505" stroke="#0B1F3A" stroke-width="1.5"/>
<text x="300" y="512" text-anchor="middle" font-family="Liberation Serif, Georgia, serif" font-size="18" font-weight="400" letter-spacing="3px" fill="#0B1F3A">BECAUSE SILENCE ISN'T STRATEGY</text>
<line x1="450" y1="505" x2="510" y2="505" stroke="#0B1F3A" stroke-width="1.5"/>

